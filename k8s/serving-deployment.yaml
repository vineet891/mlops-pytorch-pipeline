# Two replicas of the FastAPI server. The checkpoint PVC is
# mounted read-only. Probes hit GET /health on container 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
    project: mlops-pytorch-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-serving
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      containers:
        - name: server
          image: mlops-serve:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            initialDelaySeconds: 15
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
            - name: checkpoints
              mountPath: /app/checkpoints
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: training-config
        - name: checkpoints
          persistentVolumeClaim:
            claimName: model-checkpoints-pvc
            readOnly: true
