# ClusterIP service: port 80 on the service, 8080 in the container.
apiVersion: v1
kind: Service
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
    project: mlops-pytorch-pipeline
spec:
  type: ClusterIP
  selector:
    app: model-serving
  ports:
    - name: http
      port: 80
      targetPort: http
