# Pause pod used only to copy CIFAR-10 into training-data-pvc.
# Delete it after kubectl cp. It is not part of the serving path.
apiVersion: v1
kind: Pod
metadata:
  name: data-loader
  namespace: ml-training
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: busybox:1.36
      command:
        - sleep
        - "3600"
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: training-data-pvc
