# Hyperparameters mounted at /app/configs/training_config.yaml.
# download is false because cs.toronto.edu fails TLS behind a
# company proxy; CIFAR-10 is copied into the data PVC instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  namespace: ml-training
data:
  training_config.yaml: |
    model:
      architecture: resnet18
      num_classes: 10
    training:
      epochs: 10
      batch_size: 64
      learning_rate: 0.001
      early_stopping_patience: 3
      seed: 42
    data:
      dataset: cifar10
      data_dir: /app/data
      num_workers: 0
      subset_fraction: 1.0
      download: false
    output:
      checkpoint_dir: /app/checkpoints
      model_name: classifier_v1.pt
