# Lint and unit tests on every push and pull request.
# Image builds are added later once the Dockerfiles exist.
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4
          pip install torch==2.2.2 torchvision==0.17.2 \
            --index-url https://download.pytorch.org/whl/cpu
          pip install PyYAML==6.0.2 fastapi==0.115.6 uvicorn==0.34.0 \
            pillow==11.1.0 python-multipart==0.0.20 pytest ruff httpx

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest
